services:
  # --- PrimeProjects application database (Django API) ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: ["primeprojects_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      PRIMEPROJECTS_SERVICE_TOKEN: ${PRIMEPROJECTS_SERVICE_TOKEN}
    ports: ["${BACKEND_PORT}:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:${BACKEND_PORT}"
      NEXT_PUBLIC_DEMO_USERNAME: ${DEMO_USERNAME}
      NEXT_PUBLIC_DEMO_PASSWORD: ${DEMO_PASSWORD}
      # Docker Desktop bind mounts on Windows don't reliably deliver inotify
      # events, so webpack's default file watcher misses edits. Polling fixes it.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports: ["${FRONTEND_PORT}:3007"]
    volumes:
      - "./frontend:/app"
      - "frontend_node_modules:/app/node_modules"
    depends_on:
      - backend

  integration-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: ${INTEGRATION_PORT}
      ODOO_URL: "http://odoo:8069"
      ODOO_DB: ${ODOO_DB}
      ODOO_USER: ${ODOO_ADMIN_LOGIN}
      ODOO_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      PRIMEPROJECTS_SERVICE_TOKEN: ${PRIMEPROJECTS_SERVICE_TOKEN}
    ports: ["${INTEGRATION_PORT}:${INTEGRATION_PORT}"]
    volumes:
      - "./integration-service:/app"
      - "integration_node_modules:/app/node_modules"
    depends_on:
      - odoo
      - backend

  invoice-queue-worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run worker:dev"
    environment:
      PRIMEPROJECTS_API_URL: "http://backend:8000"
      INTEGRATION_PUBLIC_URL: "http://integration-service:${INTEGRATION_PORT}"
      QUEUE_POLL_MS: ${QUEUE_POLL_MS}
      PRIMEPROJECTS_SERVICE_TOKEN: ${PRIMEPROJECTS_SERVICE_TOKEN}
      DEFAULT_ODOO_PARTNER_ID: ${DEFAULT_ODOO_PARTNER_ID}
    volumes:
      - "./integration-service:/app"
      - "queue_worker_node_modules:/app/node_modules"
    depends_on:
      - integration-service
      - backend

  # --- Odoo Community Edition ---
  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes: ["primeprojects_odoo_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17.0
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
    ports: ["${ODOO_PORT}:8069"]
    volumes:
      - primeprojects_odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons

volumes:
  primeprojects_pg:
  primeprojects_odoo_db:
  primeprojects_odoo_data:
  frontend_node_modules:
  integration_node_modules:
  queue_worker_node_modules:
